name: SDK validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Build SDK
        run: dotnet build Bimo.Tools.csproj --configuration Release
      - name: Execute isolated SDK smoke consumer
        run: dotnet run --project tests/Bimo.Tools.Smoke/Bimo.Tools.Smoke.csproj --configuration Release
      - name: Verify package can be built (never publish)
        run: dotnet pack Bimo.Tools.csproj --configuration Release --output artifacts
